<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlos Fernández-Yáñez Arce | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="particles-js"></div>

    <header id="header">
        <nav id="navbar">
            </nav>
    </header>

    <main>
        <section id="home">
            <div class="home-content">
                <img src="profile.jpg" alt="Carlos Fernández-Yáñez Arce" class="profile-pic">
                <h1 id="home-name"></h1>
                <p id="home-title"></p>
                
            </div>
        </section>

        <section id="about" class="container">
            <h2 id="about-title" class="reveal"></h2>
            <div class="card about-card">
                <p id="about-description"></p>
            </div>
        </section>

        <section id="education" class="container">
            <h2 id="education-title" class="reveal"></h2>
            <div id="education-list" class="timeline"></div>
        </section>

        <section id="projects" class="container">
            <h2 id="projects-title" class="reveal"></h2>
            <div id="projects-list" class="grid"></div>
        </section>

        <section id="experience" class="container">
            <h2 id="experience-title" class="reveal"></h2>
            <div id="experience-list" class="timeline"></div>
        </section>

        <section id="skills" class="container">
            <h2 id="skills-title" class="reveal"></h2>
            <div id="skills-content">
                </div>
        </section>

        <section id="contact" class="container">
            <h2 id="contact-title" class="reveal"></h2>
            <p>If you'd like to get in touch, please feel free to email me. I'm always open to discussing new projects, creative ideas, or opportunities.</p>
            <a href="#" id="contact-email" class="button"></a>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 <span id="footer-name"></span>. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
